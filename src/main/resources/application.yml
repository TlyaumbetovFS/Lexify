spring:
  application:
    name: lexify
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lexify}
    username: ${DB_USERNAME:lexify}
    password: ${DB_PASSWORD:lexify}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

springdoc:
  paths-to-match: /api/**

app:
  auth:
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
  jwt:
    secret: ${JWT_SECRET}
    ttl: 1h
  translation:
    url: ${TRANSLATION_URL:http://localhost:5000}
  dictionary:
    url: ${DICTIONARY_URL:https://api.dictionaryapi.dev}

management:
  endpoints:
    web:
      exposure:
        include: health
