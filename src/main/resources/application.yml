spring:
  application:
    name: lexify
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lexify}
    username: ${DB_USERNAME:lexify}
    password: ${DB_PASSWORD:lexify}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 1h
  translation:
    url: ${TRANSLATION_URL:http://localhost:5000}
  dictionary:
    url: ${DICTIONARY_URL:https://api.dictionaryapi.dev}

management:
  endpoints:
    web:
      exposure:
        include: health
