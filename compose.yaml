services:
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lexify
      DB_USERNAME: ${DB_USERNAME:-lexify}
      DB_PASSWORD: ${DB_PASSWORD:-lexify}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TRANSLATION_URL: http://libretranslate:5000
      DICTIONARY_URL: ${DICTIONARY_URL:-https://api.dictionaryapi.dev}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: lexify
      POSTGRES_USER: ${DB_USERNAME:-lexify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lexify}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d lexify"]
      interval: 5s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    environment:
      LT_LOAD_ONLY: en,ru
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5m

volumes:
  postgres_data:
  libretranslate_models:
